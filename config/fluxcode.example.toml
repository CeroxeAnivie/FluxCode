# FluxCode configuration · schema 1
# UTF-8. Runtime copy: <executable directory>/data/fluxcode.toml
# Settings writes preserve comments and unrelated sections. Never put API keys here.
# External edits reload after validation. Appearance applies immediately; connection
# changes wait until active tasks/commands finish. New terminals use updated settings.
schema_version = 1

[provider]
# Responses API base URL, normally ending in /v1 (do not append /responses).
base_url = "https://api.openai.com/v1"
model = ""
api_key_env = "OPENAI_API_KEY"
wire_api = "responses"

[network]
# Optional HTTP(S)/SOCKS proxy override. Empty: process environment, then Windows
# enabled manual/PAC settings. Unreachable configured proxies report an error.
proxy_url = ""

[execution]
# This release intentionally supports only full access. No per-command approval.
sandbox_mode = "danger-full-access"
approval_policy = "never"

[terminal]
# Executable names or absolute paths. Arguments are passed as argv, never shell-built.
windows_shell = "powershell.exe"
unix_shell = "/bin/sh"
timeout_seconds = 120
output_limit_bytes = 1048576

[terminal.environment]
# Additional non-secret environment variables for the command panel.
# New terminals and the engine inherit the resolved proxy at launch.
# URL-dependent PAC rules are resolved per request by application HTTP clients.
TERM = "xterm-256color"

[ui]
# Logical pixels. Valid ranges: font 11..18, sidebar 190..360, inspector 230..600.
font_size = 14
sidebar_width = 246
inspector_width = 294

[appearance]
language = "zh-CN"
theme = "system"

[context]
# Omit to use model defaults. Reconnect after changing these settings.
# This is an engine budget, not an increase in provider model capacity.
# window_tokens = 200000
# auto_compact_tokens = 160000
