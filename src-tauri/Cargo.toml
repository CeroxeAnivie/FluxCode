[package]
name = "fluxcode"
default-run = "fluxcode"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A Codex-powered desktop coding workspace"
license = "Apache-2.0"

[lib]
name = "fluxcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
toml_edit = "0.23"

[dependencies]
tauri = { version = "=2.11.6", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "=2.4.0"
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
toml_edit = { version = "0.23", features = ["serde"] }
notify = "=8.2.0"
ignore = "0.4"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "backup"] }
sha2 = "=0.10.9"
tempfile = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
urlpattern = { path = "vendor/urlpattern" }
